name: Update bowling ball database

on:
  schedule:
    - cron: '0 12 * * 1' # Every Monday at noon UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Discover new balls and check archived
        run: node scripts/discover.mjs

      - name: Scrape ZVL categorization
        run: node scripts/zvl-scrape.mjs
        continue-on-error: true

      - name: Commit and push if changed
        run: |
          git diff --quiet data/balls.json && echo "No changes" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/balls.json
          git commit -m "chore: auto-update bowling ball database"
          git push
